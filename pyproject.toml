[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-research"
version = "1.0.0"
description = "Cited research reports from your documents: LlamaIndex hybrid RAG on pgvector plus CrewAI sequential, hierarchical and reflection crews"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alby Rajesh" }]
dependencies = [
    "crewai>=1.15",
    "llama-index-core>=0.14",
    "llama-index-llms-openai-like>=0.8",
    "llama-index-embeddings-openai-like>=0.4",
    "llama-index-retrievers-bm25>=0.8",
    "llama-index-vector-stores-postgres>=0.9",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
research = "research.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["postgres: needs pgvector Postgres at MAR_TEST_DSN"]
