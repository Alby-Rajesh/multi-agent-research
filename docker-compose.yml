services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
      POSTGRES_DB: research
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      retries: 20

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: --model-id BAAI/bge-small-en-v1.5
    ports:
      - "8001:80"
    volumes:
      - hf-cache:/data

  ingest:
    build: .
    env_file: .env
    environment: &app-env
      MAR_STORE__BACKEND: postgres
      MAR_STORE__DSN: postgresql://research:${POSTGRES_PASSWORD:-research}@postgres:5432/research
      MAR_EMBEDDING__BASE_URL: http://embeddings:80/v1
    command: ["research", "ingest"]
    depends_on:
      postgres:
        condition: service_healthy
      embeddings:
        condition: service_started
    restart: on-failure

  api:
    build: .
    env_file: .env
    environment: *app-env
    ports:
      - "8080:8080"
    depends_on:
      ingest:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  hf-cache:
