name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research"
          --health-interval 5s
          --health-retries 20
    env:
      MAR_TEST_DSN: postgresql://research:research@localhost:5432/research
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m nltk.downloader -d ~/nltk_data stopwords punkt_tab
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest -q -W ignore::DeprecationWarning --junitxml=report.xml
      - name: Annotate failing tests
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("report.xml").iter("testcase"):
              for problem in list(case.iter("failure")) + list(case.iter("error")):
                  text = (problem.get("message") or "") + " | " + (problem.text or "")[-1500:]
                  print(f"::error title={case.get('classname')}.{case.get('name')}::" + text.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
